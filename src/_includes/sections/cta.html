<section id="cta-384">
    <div class="cs-container">
        <div class="cs-content">
            <span class="cs-topper">Our Team</span>
            <h2 class="cs-title">Do you need a perfect cleaning?</h2>
            <p class="cs-text">
                We love what we do and we do it with passion. We value the experimentation of the smart incentives.
            </p>
            <a href="" class="cs-button-solid">Get A Quote</a>
        </div>
        <div class="cs-image-group">
            <!--Powder Image-->
            <picture class="cs-powder">
                <source media="(max-width: 600px)" 
                        srcset="{% getUrl "/assets/images/powder.png" | resize({ width: 600, height: 569 }) | webp %}" 
                        type="image/webp">
                <source media="(min-width: 601px)" 
                        srcset="{% getUrl "/assets/images/powder.png" | resize({ width: 485, height: 460 }) | webp %}" 
                        type="image/webp">
                <img src="{% getUrl "/assets/images/powder.png" | resize({ width: 485, height: 460 }) | png %}" 
                     alt="powder" width="485" height="460" loading="lazy" decoding="async" aria-hidden="true">
            </picture>
            <!--Bucket Image-->
            <picture class="cs-bucket">
                <source media="(max-width: 600px)" 
                        srcset="{% getUrl "/assets/images/bucket.png" | resize({ width: 600, height: 483 }) | webp %}" 
                        type="image/webp">
                <source media="(min-width: 601px)" 
                        srcset="{% getUrl "/assets/images/bucket.png" | resize({ width: 543, height: 437 }) | webp %}" 
                        type="image/webp">
                <img src="{% getUrl "/assets/images/bucket.png" | resize({ width: 543, height: 437 }) | png %}" 
                     alt="bucket" width="543" height="437" loading="lazy" decoding="async" aria-hidden="true">
            </picture>
        </div>
    </div>
    <!--Background Image-->
    <picture class="cs-background">
        <source media="(max-width: 600px)" srcset="https://csimg.nyc3.digitaloceanspaces.com/CTA/fabric-m.png">
        <source media="(min-width: 601px)" srcset="https://csimg.nyc3.digitaloceanspaces.com/CTA/fabric.png">
        <img loading="lazy" decoding="async" src="https://csimg.nyc3.digitaloceanspaces.com/CTA/fabric.png" alt="fabric" width="1920" height="660" aria-hidden="true">
    </picture>
</section>
